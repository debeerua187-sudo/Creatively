name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -u+x | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No executable sdkmanager found. SDK contents:"
            find "$ANDROID_HOME/cmdline-tools" -maxdepth 4 -type f 2>/dev/null | head -n 60 || true
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version
      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDKMANAGER="${{ steps.android-sdk.outputs.sdkmanager }}"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: creativelydifferent-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
