name: Build Andries Crisstel Widget
on:
  workflow_dispatch:
  push:
    paths:
      - 'together-counter/**'
      - '.github/workflows/build-together-counter.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK manager
        id: android-sdk
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager -perm -u+x | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "No executable sdkmanager found"
            exit 1
          fi
          echo "sdkmanager=$SDKMANAGER" >> "$GITHUB_OUTPUT"
          "$SDKMANAGER" --version
      - name: Install Android platform and build tools
        shell: bash
        run: |
          SDKMANAGER="${{ steps.android-sdk.outputs.sdkmanager }}"
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platforms;android-35"
          "$SDKMANAGER" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle --no-daemon -p together-counter assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Andries-Crisstel-Widget-APK
          path: together-counter/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
